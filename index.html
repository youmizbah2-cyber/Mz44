<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Design Test Panel</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #2e1065; /* একদম নতুন গাড় পার্পল ব্যাকগ্রাউন্ড */
            color: #facc15; /* উজ্জ্বল হলুদ লেখা */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #4c1d95;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.5);
            width: 100%;
            max-width: 450px;
            border: 3px dashed #facc15;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff007f; /* নিয়ন পিংক হেডিং */
            font-size: 22px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #38bdf8;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #facc15;
            background-color: #1e1b4b;
            color: #fff;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        .switch-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #1e1b4b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ff007f;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #64748b;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #ff007f; }
        input:checked + .slider:before { transform: translateX(24px); }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff007f;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,0,127,0.4);
        }
        button:hover { background-color: #e60073; }
        #msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            color: #facc15;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 ডিজাইন টেস্ট মোড v2</h2>
    
    <div class="switch-group">
        <label>অ্যাপ স্ট্যাটাস:</label>
        <label class="switch">
            <input type="checkbox" id="app_status">
            <span class="slider"></span>
        </label>
    </div>

    <div class="switch-group">
        <label>ফোর্স আপডেট:</label>
        <label class="switch">
            <input type="checkbox" id="force_update">
            <span class="slider"></span>
        </label>
    </div>

    <div class="form-group">
        <label>ভার্সন:</label>
        <input type="text" id="version">
    </div>

    <div class="form-group">
        <label>ডাউনলোড লিংক:</label>
        <input type="text" id="download_url">
    </div>

    <div class="form-group">
        <label>নোটিশ:</label>
        <textarea id="notice"></textarea>
    </div>

    <button onclick="saveConfig()">নতুন ডিজাইনে সেভ করুন</button>
    <div id="msg"></div>
</div>

<script>
    const GITHUB_USER = "youmizbah2-cyber";
    const REPO_NAME = "Mz44";
    const FILE_PATH = "config.json";
    const GITHUB_TOKEN = "আপনার_আসল_টোকেন_এখানে_বসান"; // আপনার টোকেন এখানে বসাবেন

    const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FILE_PATH}`;
    let fileSha = "";

    async function loadConfig() {
        document.getElementById('msg').innerText = "টেস্ট ডাটা লোড হচ্ছে...";
        try {
            let response = await fetch(API_URL, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });
            if(response.ok) {
                let data = await response.json();
                fileSha = data.sha;
                let content = JSON.parse(atob(data.content));

                document.getElementById('app_status').checked = content.app_status || false;
                document.getElementById('force_update').checked = content.force_update || false;
                document.getElementById('version').value = content.version || "";
                document.getElementById('download_url').value = content.download_url || "";
                document.getElementById('notice').value = content.notice || "";
                document.getElementById('msg').innerText = "✅ নতুন ডিজাইন সফলভাবে লোড হয়েছে!";
            } else {
                document.getElementById('msg').innerText = "লোড করতে সমস্যা!";
            }
        } catch (error) {
            document.getElementById('msg').innerText = "নেটওয়ার্ক এরর!";
        }
    }

    async function saveConfig() {
        document.getElementById('msg').innerText = "সেভ হচ্ছে...";
        let updatedData = {
            app_status: document.getElementById('app_status').checked,
            force_update: document.getElementById('force_update').checked,
            version: document.getElementById('version').value,
            download_url: document.getElementById('download_url').value,
            notice: document.getElementById('notice').value
        };
        let contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(updatedData, null, 2))));

        try {
            let response = await fetch(API_URL, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Test design update",
                    content: contentEncoded,
                    sha: fileSha
                })
            });
            let result = await response.json();
            if(response.ok) {
                fileSha = result.content.sha;
                alert("সফলভাবে সেভ হয়েছে!");
                document.getElementById('msg').innerText = "🎉 গিটহাবে পার্মানেন্ট সেভ হয়েছে!";
            } else {
                alert("সেভ হয়নি: " + result.message);
            }
        } catch (error) {
            alert("ত্রুটি: " + error.message);
        }
    }

    window.onload = loadConfig;
</script>

</body>
</html>
